
services:
  - type: web
    name: edutube-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGIN
        value: https://educational-platform-frontend-4e7x.onrender.com,https://edutube-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODERATION_MODEL
        value: gemini-3.8-flash
      - key: MODERATOR_EMAILS
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PASSWORD
        sync: false

  - type: web
    name: edutube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://edutube-backend.onrender.com
      - key: VITE_FIREBASE_APIKEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

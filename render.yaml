
services:
  - type: web
    name: edutube-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGIN
        value: https://edutube-frontend-qr5q.onrender.com,https://educational-platform-frontend-4e7x.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_AUTH_TOKEN_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODERATION_MODEL
        value: gemini-3.8-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ALLOWED_CURRENCIES
        value: INR
      - key: MODERATOR_EMAILS
        sync: false
      - key: AGENT_PANEL_URL
        sync: false
      - key: AGENT_PANEL_FRONTEND_URL
        sync: false
      - key: AGENT_PANEL_INTEGRATION_SECRET
        sync: false
      - key: EDUTUBE_COUNTRY_HEADER
        value: cf-ipcountry
      - key: USER_EMAIL
        sync: false
      - key: USER_PASSWORD
        sync: false

  - type: web
    name: edutube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://edutube-backend-gfmr.onrender.com
      - key: VITE_FIREBASE_APIKEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
